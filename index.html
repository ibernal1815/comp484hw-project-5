<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>CSUN Map Quiz</title>
  <link rel="stylesheet" href="style.css" />
  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
</head>
<body>

  <div id="panel">
    <h1>Map Quiz</h1>
    <p>Please double click on the map the location of:</p>

    <div id="question-box">
      <p id="question-text">Loading...</p>
    </div>

    <div id="feedback-box"></div>

    <div id="timer-box">
      Time: <span id="timer">0:00</span>
    </div>

    <div id="score-box" class="hidden">
      <p id="final-score"></p>
      <button id="restart-btn">Play Again</button>
    </div>
  </div>

  <div id="map"></div>

  <!--
    replace YOUR_API_KEY with your actual key from google cloud console.
    make sure Maps JavaScript API is enabled and billing is set up.
    the geometry library is needed for distance calculation.
  -->
  <script src="https://maps.googleapis.com/maps/api/js?key=YOUR_API_KEY&libraries=geometry&callback=initMap" async defer></script>
  <script src="app.js"></script>

</body>
</html>
