<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>CSUN Map Quiz</title>

  <!-- preconnect shaves a little load time off the google fonts request -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

  <!--
    syne is used for display text (logo, building name, score number) —
    it's geometric and heavy so it reads well at large sizes.
    space mono handles all the data/ui text (timer, log entries, counter)
    since monospace digits don't jump around as the numbers change.
  -->
  <link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Syne:wght@700;800&display=swap" rel="stylesheet" />

  <link rel="stylesheet" href="style.css" />

  <!-- jquery is allowed per the project spec, using it for DOM manipulation -->
  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
</head>
<body>

  <!-- left panel — all game UI lives here, map fills everything to the right -->
  <div id="panel">

    <!-- top row: logo on the left, question counter on the right -->
    <div id="panel-header">
      <div id="logo">
        <span id="logo-csun">CSUN</span>
        <span id="logo-sub">MAP QUIZ</span>
      </div>
      <!-- q-current and q-total are updated by updateCounter() in app.js -->
      <div id="q-counter">
        <span id="q-current">1</span><span id="q-sep">/</span><span id="q-total">5</span>
      </div>
    </div>

    <!--
      svg timer ring — two concentric circles stacked on top of each other.
      ring-bg is the static dark track, ring-fg is the accent stroke on top.
      the svg is rotated -90deg in css so the stroke starts at 12 o'clock
      instead of 3 o'clock. timer-display inside shows the mm:ss text.
    -->
    <div id="timer-ring-wrap">
      <svg id="timer-svg" viewBox="0 0 120 120">
        <circle class="ring-bg" cx="60" cy="60" r="50" />
        <circle class="ring-fg" id="ring-progress" cx="60" cy="60" r="50" />
      </svg>
      <div id="timer-center">
        <!-- timer-display text is updated every second by updateTimerDisplay() -->
        <div id="timer-display">0:00</div>
        <div id="timer-label">elapsed</div>
      </div>
    </div>

    <!--
      prompt section — shows the current building the user needs to find.
      prompt-name is swapped out by showQuestion() in app.js each round.
      the whole section gets a .flash class briefly when the question changes
      to make the transition obvious, then the class is removed.
    -->
    <div id="prompt-section">
      <div id="prompt-eyebrow">double click to locate</div>
      <div id="prompt-name">Loading...</div>
    </div>

    <!--
      answer log — entries are appended here by showQuestion() as pending,
      then updated to correct or wrong by updateLogEntry() after each guess.
      the log scrolls if there are more entries than fit in the panel.
    -->
    <div id="log-section">
      <div id="log-header">Answer Log</div>
      <div id="answer-log"></div>
    </div>

    <!--
      score screen — hidden during the game, shown by endGame() when all
      five questions are answered. score-correct, score-breakdown, and
      score-time-final are all filled in dynamically from app.js.
    -->
    <div id="score-screen">
      <div id="score-label">Final Score</div>
      <div id="score-fraction">
        <span id="score-correct">0</span><span id="score-denom">/5</span>
      </div>
      <div id="score-breakdown"></div>
      <div id="score-time-final"></div>
      <button id="restart-btn">Play Again</button>
    </div>

  </div>

  <!--
    map-wrap exists so we can layer pseudo-elements (scan lines, border glow)
    over the map using ::before and ::after in css without touching the map div
    itself, since google maps injects its own children into #map directly.
  -->
  <div id="map-wrap">
    <div id="map"></div>
  </div>

  <!--
    google maps API script tag.
    - key: replace YOUR_API_KEY with your actual key from google cloud console
    - libraries=geometry: loads the spherical geometry library which gives us
      computeDistanceBetween() for measuring how far off each guess is
    - callback=initMap: tells the API to call our initMap() function in app.js
      once it finishes loading, which is why initMap has to be a global function
    - async defer: loads the script without blocking the rest of the page
  -->
  <script
    src="https://maps.googleapis.com/maps/api/js?key=AIzaSyDXnvJjPaqypxFQ-nXrXAhNucJMwykTu2s&libraries=geometry&callback=initMap"
    async defer
  ></script>

  <!-- app.js loaded after the maps tag so the DOM is ready when it runs -->
  <script src="app.js"></script>

</body>
</html>
