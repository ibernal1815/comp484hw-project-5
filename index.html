<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>CSUN Map Quiz</title>

  <!-- preconnect shaves load time off the google fonts request -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

  <!--
    syne for display text (logo, building name, score).
    space mono for all data/ui text (timer, log, counter) —
    monospace digits don't shift width as numbers change.
  -->
  <link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Syne:wght@700;800&display=swap" rel="stylesheet" />

  <link rel="stylesheet" href="style.css" />

  <!-- jquery loaded in head so it's ready before app.js runs -->
  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>

  <!-- app.js loaded here BEFORE the maps tag so initMap is defined
       by the time the maps API calls it via the callback param -->
  <script src="app.js"></script>
</head>
<body>

  <!-- left panel — all game UI lives here -->
  <div id="panel">

    <!-- logo left, question counter right -->
    <div id="panel-header">
      <div id="logo">
        <span id="logo-csun">CSUN</span>
        <span id="logo-sub">MAP QUIZ</span>
      </div>
      <!-- updated by updateCounter() in app.js -->
      <div id="q-counter">
        <span id="q-current">1</span><span id="q-sep">/</span><span id="q-total">5</span>
      </div>
    </div>

    <!--
      svg timer ring — ring-bg is the static dark track,
      ring-fg is the accent stroke on top.
      rotated -90deg in css so the stroke starts at 12 o'clock.
    -->
    <div id="timer-ring-wrap">
      <svg id="timer-svg" viewBox="0 0 120 120">
        <circle class="ring-bg" cx="60" cy="60" r="50" />
        <circle class="ring-fg" id="ring-progress" cx="60" cy="60" r="50" />
      </svg>
      <div id="timer-center">
        <!-- updated every second by updateTimerDisplay() -->
        <div id="timer-display">0:00</div>
        <div id="timer-label">elapsed</div>
      </div>
    </div>

    <!--
      prompt — shows the current building to find.
      prompt-name is swapped by showQuestion() each round.
      gets .flash class briefly when question changes.
    -->
    <div id="prompt-section">
      <div id="prompt-eyebrow">double click to locate</div>
      <div id="prompt-name">Loading...</div>
    </div>

    <!--
      answer log — entries appended as pending by showQuestion(),
      then updated to correct/wrong by updateLogEntry() after each guess.
    -->
    <div id="log-section">
      <div id="log-header">Answer Log</div>
      <div id="answer-log"></div>
    </div>

    <!--
      score screen — hidden during game, shown by endGame().
      score-correct, score-breakdown, score-time-final filled by app.js.
    -->
    <div id="score-screen">
      <div id="score-label">Final Score</div>
      <div id="score-fraction">
        <span id="score-correct">0</span><span id="score-denom">/5</span>
      </div>
      <div id="score-breakdown"></div>
      <div id="score-time-final"></div>
      <button id="restart-btn">Play Again</button>
    </div>

  </div>

  <!--
    map-wrap wraps the map div so we can layer pseudo-elements
    (scan lines, border glow) without touching the map div itself,
    since google maps injects its own children into #map directly.
  -->
  <div id="map-wrap">
    <div id="map"></div>
  </div>

  <!--
    google maps API — loaded last, at the bottom of body.
    key: replace YOUR_API_KEY with your actual key.
    libraries=geometry: loads spherical library for computeDistanceBetween().
    callback=initMap: calls our initMap() once the API is ready.
    app.js is loaded in the head above so initMap is already defined by now.
  -->
  <script
    src="https://maps.googleapis.com/maps/api/js?key=YOUR_API_KEY&libraries=geometry&callback=initMap"
    async defer
  ></script>

</body>
</html>
